name: PBRP - Build

on:
  workflow_dispatch:
    inputs:
      ANDROID_VERSION:
        description: "Android version"
        required: true
        default: "15"
        type: choice
        options:
          - "14"
          - "15"
          - "16"
      BUILD_FINGERPRINT:
        description: "Build fingerprint"
        required: true
        type: string

jobs:
  build:
    name: Build PBRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEVICE_PATH: device/motorola/fogorow
      DEVICE_NAME: fogorow
      BUILD_TARGET: vendorboot
      RECOVERY_TYPE: vendor_boot
      CCACHE_DIR: /tmp/ccache
      # Manifest oficial de PitchBlack Recovery Project
      MANIFEST_URL: https://github.com/PitchBlackRecoveryProject/manifest_pb.git
      # Cambia esto a la rama de PBRP que necesites (ej. android-12.1, android-11.0)
      MANIFEST_BRANCH: android-12.1 
      CCACHE_TEMPDIR: /tmp/ccache-tmp

    permissions:
      contents: write

    steps:
    - name: Check runner specs
      run: |
        echo "Runner name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        nproc
        free -h
        df -h

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2.11
      with:
        key: pbrp-${{ env.MANIFEST_BRANCH }}-${{ env.DEVICE_NAME }}
        max-size: 10G
        append-timestamp: true
    
    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 8

    - name: Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Restore PBRP source cache
      id: pbrp-source-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/PBRP/.repo
        key: pbrp-source-${{ runner.os }}-${{ env.MANIFEST_BRANCH }}

    - name: Set-up Manifest & Sync
      shell: bash
      run: |
        set -e
        ROOT_DIR="${GITHUB_WORKSPACE}/PBRP"
        mkdir -p "${ROOT_DIR}"
        
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"
        
        cd "${ROOT_DIR}"
        repo init -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }} -c --no-tags --depth=1 --git-lfs
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd "${GITHUB_WORKSPACE}/PBRP"
        git clone "https://github.com/${{ github.repository }}" \
          -b "${{ github.ref_name }}" \
          "./${{ env.DEVICE_PATH }}"
        
        cd "${{ env.DEVICE_PATH }}"
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "DEVICE_TREE_URL=https://github.com/${{ github.repository }}" >> "$GITHUB_ENV"
        echo "DEVICE_TREE_BRANCH=${{ github.ref_name }}" >> "$GITHUB_ENV"

    - name: Fill PLATFORM_VERSION in BoardConfig.mk
      shell: bash
      env:
        ANDROID_VERSION: ${{ github.event.inputs.ANDROID_VERSION }}
      run: |
        set -e
        BOARD_CONFIG="${GITHUB_WORKSPACE}/PBRP/${{ env.DEVICE_PATH }}/BoardConfig.mk"
        
        sed -i "s/^PLATFORM_VERSION[[:space:]]*:=.*/PLATFORM_VERSION := ${ANDROID_VERSION}/" "$BOARD_CONFIG"
        
        if ! grep -q "^PLATFORM_VERSION := ${ANDROID_VERSION}$" "$BOARD_CONFIG"; then
          echo "::error::Failed to set PLATFORM_VERSION"
          exit 1
        fi

    - name: Fill fingerprint props in system.prop
      shell: bash
      env:
        BUILD_FINGERPRINT: ${{ github.event.inputs.BUILD_FINGERPRINT }}
      run: |
        set -e
        PROP_FILE="${GITHUB_WORKSPACE}/PBRP/${{ env.DEVICE_PATH }}/system.prop"
        
        mkdir -p "$(dirname "$PROP_FILE")"
        touch "$PROP_FILE"
        sed -i '/^ro\.build\.fingerprint=/d' "$PROP_FILE"
        sed -i '/^ro\.vendor\.build\.fingerprint=/d' "$PROP_FILE"
        
        {
          echo ""
          echo "# Fingerprint / Build"
          echo "ro.build.fingerprint=${BUILD_FINGERPRINT}"
          echo "ro.vendor.build.fingerprint=${BUILD_FINGERPRINT}"
        } >> "$PROP_FILE"
        
